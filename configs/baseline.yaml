seed: 42
audio:
  sample_rate: 24000
  n_fft: 1024
  win_length: 1024
  hop_length: 256
  n_mels: 100
  f_min: 0.0
  f_max: null
  log_clip: 1.0e-05
  target_rms: 0.1
model:
  conditioning_mode: flowtse
  attention_mode: bidirectional
  mel_dim: 100
  hidden_size: 1024
  depth: 16
  num_heads: 16
  mlp_ratio: 4.0
flow:
  start_state: gaussian
  cfg: false
  steps: 16
  solver: euler
inference:
  chunk_seconds: 3.0
  protocol: full_mel_flow_chunks_single_bigvgan_v1
vocoder:
  checkpoint_dir: pretrained/bigvgan_v2_24khz_100band_256x
data:
  root: /share/202611/FlowTSE-RL-share/data
  asr_reference_dir: asr_references
  format: librimix_precomputed
  train_dirs:
  - LibriMix/Libri2Mix/wav16k/min/train-100
  - LibriMix/Libri2Mix/wav16k/min/train-360
  validation_dir: LibriMix/Libri2Mix/wav16k/min/dev
  test_dir: LibriMix/Libri2Mix/wav16k/min/test
  metadata_dir: LibriMix/Libri2Mix/wav16k/min/metadata
  input_sample_rate: 16000
  segment_seconds: 3.0
  validation_segment_seconds: null
  enrollment_seconds:
  - 3.0
  - 3.0
  train_data_ratio: 1.0
  max_frames_per_batch: 18080
  max_samples_per_batch: 32
  validation_batch_size: 1
optimizer:
  lr: 0.0001
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.01
  warmup_epochs: 5
  minimum_lr_ratio: 0.1
  schedule: cosine
train:
  num_epochs: 500
  precision: bf16-mixed
  accumulation_steps: 1
  gradient_clip_val: 1.0
  log_interval: 20
  max_steps: -1
  wandb: false
  wandb_project: FlowTSE-RL
  wandb_name: baseline
validation:
  loss_ratio: 0.2
  quality_metrics_ratio: 1.0
  run_external_metrics: false
  quality_audio_keep_items: 0
  every_n_epochs: 10
  metrics:
  - si_sdr
  - pesq
  - estoi
checkpoint:
  dir: runs/baseline
  resume: null
  auto_resume: true
  load_weights_only: false
  monitor: val/pesq
  mode: max
  save_top_k: 3
  last_every_n_epochs: 1
ddp:
  use_ddp: true
  num_nodes: 1
  num_gpus: 4
